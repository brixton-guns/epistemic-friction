[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-friction"
version = "0.1.0"
description = "An open, falsifiable framework for testing conversational inertia and epistemic calibration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Michele Montedoro"}]
dependencies = []

[project.scripts]
epistemic-friction-validate = "epistemic_friction.validate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
