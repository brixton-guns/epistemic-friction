[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-friction"
version = "0.2.0"
description = "Open protocols for auditing evidence selection and testing epistemic calibration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Michele Montedoro"}]
dependencies = []

[project.scripts]
epistemic-friction-validate = "epistemic_friction.validate:main"
epistemic-friction-render-audit = "epistemic_friction.audit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
